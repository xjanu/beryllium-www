<!DOCTYPE html>
<html>

<head>
	<link rel="shortcut icon" href="favicon.ico">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="images/icon-192.png">
	<meta name="theme-color" content="#000000">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
	<meta charset="UTF-8" />
	<script type="text/javascript" src="speedtest.js"></script>
	<script type="text/javascript" src="chart.js"></script>
	<script type="text/javascript">
		function I(i) { return document.getElementById(i); }

		var meterBk = /Trident.*rv:(\d+\.\d+)/i.test(navigator.userAgent) ? "#EAEAEA" : "#80808040";
		var pingColor = "#1f77b4",
			jitterColor = "#ff7f0e",
			dlColor = "#2ca02c",
			ulColor = "#d62728";
		var progColor = meterBk;
		var count_ping = 20;
		var timeDownUpLoad = 15;

		//INITIALIZE SPEEDTEST
		var s = new Speedtest(); //create speed test object
		s.setParameter("telemetry_level", "off");
		s.setParameter("time_auto", "off");
		s.setParameter("count_ping_min", count_ping);
		s.setParameter("time_dl_max", timeDownUpLoad);
		s.setParameter("time_ul_max", timeDownUpLoad);

		var pingJitterChart = null;
		var downloadUploadChart = null;

		//CODE FOR GAUGES
		function drawMeter(c, amount, bk, fg, progress, prog) {
			var ctx = c.getContext("2d");
			var dp = window.devicePixelRatio || 1;
			var cw = c.clientWidth * dp, ch = c.clientHeight * dp;
			var sizScale = ch * 0.0055;
			if (c.width == cw && c.height == ch) {
				ctx.clearRect(0, 0, cw, ch);
			} else {
				c.width = cw;
				c.height = ch;
			}
			ctx.beginPath();
			ctx.strokeStyle = bk;
			ctx.lineWidth = 12 * sizScale;
			ctx.arc(c.width / 2, c.height - 58 * sizScale, c.height / 1.8 - ctx.lineWidth, -Math.PI * 1.1, Math.PI * 0.1);
			ctx.stroke();
			ctx.beginPath();
			ctx.strokeStyle = fg;
			ctx.lineWidth = 12 * sizScale;
			ctx.arc(c.width / 2, c.height - 58 * sizScale, c.height / 1.8 - ctx.lineWidth, -Math.PI * 1.1, amount * Math.PI * 1.2 - Math.PI * 1.1);
			ctx.stroke();
			if (typeof progress !== "undefined") {
				ctx.fillStyle = prog;
				ctx.fillRect(c.width * 0.3, c.height - 16 * sizScale, c.width * 0.4 * progress, 4 * sizScale);
			}
		}
		function mbpsToAmount(s) {
			return 1 - (1 / (Math.pow(1.3, Math.sqrt(s))));
		}
		function format(d) {
			d = Number(d);
			if (d < 10) return d.toFixed(2);
			if (d < 100) return d.toFixed(1);
			return d.toFixed(0);
		}

		//UI CODE
		function sum(arr) {
			return arr.reduce((a, b) => a + b);
		}
		function stddev(arr, avg) {
			if (arr.length < 5) {
				return NaN
			}
			return Math.sqrt(sum(arr.map((a) => (a - avg)**2)) / (arr.length - 1))
		}
		var uiData = null;
		function startStop() {
			initUI();
			if (s.getState() == 3) {
				//speed test is running, abort
				s.abort();
				data = null;
				I("startStopBtn").className = "";
				I("startStopBtn").setAttribute("aria-label", "Start");
			} else {
				//test is not running, begin
				I("startStopBtn").className = "running";
				I("startStopBtn").setAttribute("aria-label", "Abort");
				s.onupdate = function (data) {
					const testStateMap = {
						"-1": "notStarted",
						"0":  "starting",
						"1":  "download",
						"2":  "ping",
						"3":  "upload",
						"4":  "finished",
						"5":  "aborted"
					}
					uiData.testState = testStateMap[data.testState]
					uiData.dlStatus = Number(data.dlStatus)
					uiData.ulStatus = Number(data.ulStatus)
					uiData.pingStatus = Number(data.pingStatus)
					uiData.jitterStatus = Number(data.jitterStatus)
					uiData.dlProgress = Number(data.dlProgress)
					uiData.ulProgress = Number(data.ulProgress)
					uiData.pingProgress = Number(data.pingProgress)
					if (uiData.testState == "ping") {
						uiData.ping.push(uiData.pingStatus)
						uiData.pingAvg = sum(uiData.ping) / uiData.ping.length
						uiData.jitter.push(stddev(uiData.ping, uiData.pingAvg))
						uiData.pingTime.push(Number(data.pingTime))
					}
					if (uiData.testState == "download") {
						uiData.download[Math.floor(uiData.dlProgress * timeDownUpLoad)] = uiData.dlStatus;
					}
					if (uiData.testState == "upload") {
						uiData.upload[Math.floor(uiData.ulProgress * timeDownUpLoad)] = uiData.ulStatus;
					}
				};
				s.onend = function (aborted) {
					I("startStopBtn").className = "";
					I("startStopBtn").setAttribute("aria-label", "Start");
					updateUI(true);
				};
				s.start();
			}
		}
		//this function reads the data sent back by the test and updates the UI
		function updateUI(forced) {
			if (!forced && s.getState() != 3) return;
			if (uiData == null) return;

			if (uiData.testState == "ping") {

				I("pingText").textContent = format(uiData.pingStatus);
				drawMeter(I("pingMeter"), mbpsToAmount(Number(uiData.pingStatus)), meterBk, pingColor, Number(uiData.pingProgress), progColor);
				I("jitText").textContent = format(uiData.jitterStatus);
				drawMeter(I("jitMeter"), mbpsToAmount(Number(uiData.jitterStatus)), meterBk, jitterColor, Number(uiData.pingProgress), progColor);

				pingJitterChart.data.labels = uiData.pingTime.map((t) => Math.floor(t / 100) / 10);
    			pingJitterChart.data.datasets[0].data = uiData.ping;
				pingJitterChart.data.datasets[1].data = uiData.jitter;

				pingJitterChart.update('none');
			}

			if (uiData.testState == "download") {
				I("dlText").textContent = format(uiData.dlStatus);
				drawMeter(I("dlMeter"), mbpsToAmount(Number(uiData.dlStatus)), meterBk, dlColor, Number(uiData.dlProgress), progColor);

    			downloadUploadChart.data.datasets[0].data = uiData.download;
				downloadUploadChart.update('none');
			}

			if (uiData.testState == "upload") {
				I("ulText").textContent = format(uiData.ulStatus);
				drawMeter(I("ulMeter"), mbpsToAmount(Number(uiData.ulStatus)), meterBk, ulColor, Number(uiData.ulProgress), progColor);

    			downloadUploadChart.data.datasets[1].data = uiData.upload;
				downloadUploadChart.update('none');
			}

			if (uiData.testState == "finished") {
				I("pingText").textContent = format(uiData.pingAvg);
			}
		}
		//update the UI every frame
		window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.msRequestAnimationFrame || (function (callback, element) { setTimeout(callback, 1000 / 60); });
		function frame() {
			requestAnimationFrame(frame);
			updateUI();
		}
		frame(); //start frame loop
		//function to (re)initialize UI
		function initUI() {
			uiData = {
				testState: "notStarted", // -1=not started, 0=starting, 1=download test, 2=ping+jitter test, 3=upload test, 4=finished, 5=abort
				dlStatus: null,
				ulStatus: null,
				ping: [],
				pingAvg: null,
				jitter: [],
				pingTime: [],
				download: {},
				upload: {},
				dlProgress: 0,
				ulProgress: 0,
				pingProgress: 0
			};

			drawMeter(I("pingMeter"), 0, meterBk, dlColor, 0);
			drawMeter(I("jitMeter"), 0, meterBk, ulColor, 0);
			drawMeter(I("dlMeter"), 0, meterBk, dlColor, 0);
			drawMeter(I("ulMeter"), 0, meterBk, ulColor, 0);
			I("dlText").textContent = "";
			I("ulText").textContent = "";
			I("pingText").textContent = "";
			I("jitText").textContent = "";

			if (pingJitterChart != null) {
				pingJitterChart.destroy();
			}
			if (downloadUploadChart != null) {
				downloadUploadChart.destroy();
			}

			pingJitterChart = new Chart(I("pingJitterChart"), {
				type: 'line',
				data: {
					datasets: [
						{
							label: "Ping",
      						borderColor: pingColor,
      						backgroundColor: pingColor,
							data: []
						},
						{
							label: "Jitter",
      						borderColor: jitterColor,
      						backgroundColor: jitterColor,
							data: []
						}
					]
				},
				options: {
					responsive: true,
					tooltips: {
						enabled: false
					},
					scales: {
						x: {
							type: "linear",
							title: {
								text: "Time (s)",
								display: true
							},
							min: 0,
							suggestedMax: 10
						},
						y: {
							type: "linear",
							title: {
								text: "Ping, Jitter (ms)",
								display: true
							},
							min: 0,
							suggestedMax: 10
						},
					}
				}
			});
			downloadUploadChart = new Chart(I("downloadUploadChart"), {
				type: 'line',
				data: {
					datasets: [
						{
							label: "Download",
      						borderColor: dlColor,
      						backgroundColor: dlColor,
							data: []
						},
						{
							label: "Upload",
      						borderColor: ulColor,
      						backgroundColor: ulColor,
							data: []
						}
					]
				},
				options: {
					responsive: true,
					tooltips: {
						enabled: false
					},
					scales: {
						x: {
							type: "linear",
							title: {
								text: "Time (s)",
								display: true
							},
							min: 0,
							max: timeDownUpLoad
						},
						y: {
							type: "linear",
							title: {
								text: "Download, Upload speed (Mbit/s)",
								display: true
							},
							min: 0,
							suggestedMax: 20
						}
					}
				}
			});
		}
	</script>
	<style type="text/css">
		html,
		body {
			border: none;
			padding: 0;
			margin: 0;
			background: #FFFFFF;
			color: #202020;
		}

		body {
			text-align: center;
			font-family: "Roboto", sans-serif;
		}

		h1 {
			color: #404040;
		}

		#startStopBtn {
			display: inline-block;
			margin: 0 auto;
			color: #6060AA;
			background-color: rgba(0, 0, 0, 0);
			border: 0.15em solid #6060FF;
			padding: 0;
			font: inherit;
			border-radius: 0.3em;
			transition: all 0.3s;
			box-sizing: border-box;
			width: 8em;
			height: 3em;
			line-height: 2.7em;
			cursor: pointer;
			box-shadow: 0 0 0 rgba(0, 0, 0, 0.1), inset 0 0 0 rgba(0, 0, 0, 0.1);
		}

		#startStopBtn:hover {
			box-shadow: 0 0 2em rgba(0, 0, 0, 0.1), inset 0 0 1em rgba(0, 0, 0, 0.1);
		}

		#startStopBtn.running {
			background-color: #FF3030;
			border-color: #FF6060;
			color: #FFFFFF;
		}

		#startStopBtn:before {
			content: "Start";
		}

		#startStopBtn.running:before {
			content: "Abort";
		}

		#test {
			margin-top: 2em;
			margin-bottom: 2em;
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
		}

		div.testGroupRow {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-evenly;
		}

		div.testGroupColumn {
			flex-grow: 1;
		}

		div.testMeter {
			display: inline-block;
			width: 16em;
			height: 12.5em;
			position: relative;
			box-sizing: border-box;
		}

		div.testMeter div.testName {
			position: absolute;
			top: 0.1em;
			left: 0;
			width: 100%;
			font-size: 1.4em;
			z-index: 9;
		}

		div.testMeter div.meterText {
			position: absolute;
			bottom: 1.55em;
			left: 0;
			width: 100%;
			font-size: 2.5em;
			z-index: 9;
		}

		div.meterText:empty:before {
			content: "0.00";
		}

		div.testMeter div.unit {
			position: absolute;
			bottom: 2em;
			left: 0;
			width: 100%;
			z-index: 9;
		}

		div.testMeter canvas {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
		}

		div.testChart {
			display: inline-block;
			position: relative;
			box-sizing: border-box;
			height: 100%;
			width: 100%;
		}

		div.testGroup {
			display: flex;
			flex-direction: column;
			align-items: stretch;
		}

		@media all and (max-width:40em) {
			body {
				font-size: 0.8em;
			}
		}
	</style>
	<title>speedtest.martinjanu.eu</title>
</head>

<body onload="initUI()">
	<h1>Speedtest</h1>
	<button id="startStopBtn" onclick="startStop()" aria-label="Start"></button><br />
	<div id="test">
		<div class="testGroup">
			<div class="testGroupRow">
				<div class="testGroupColumn">
					<div class="testMeter">
						<div class="testName">Ping</div>
						<canvas id="pingMeter" class="meter"></canvas>
						<div id="pingText" class="meterText"></div>
						<div class="unit">ms</div>
					</div>
				</div>
				<div class="testGroupColumn">
					<div class="testMeter">
						<div class="testName">Jitter</div>
						<canvas id="jitMeter" class="meter"></canvas>
						<div id="jitText" class="meterText"></div>
						<div class="unit">ms</div>
					</div>
				</div>
			</div>
			<div class="testGroupRow">
				<div class="testGroupColumn">
					<div class="testChart">
						<canvas id="pingJitterChart"></canvas>
					</div>
				</div>
			</div>
		</div>
		<div class="testGroup">
			<div class="testGroupRow">
				<div class="testGroupColumn">
					<div class="testMeter">
						<div class="testName">Download</div>
						<canvas id="dlMeter" class="meter"></canvas>
						<div id="dlText" class="meterText"></div>
						<div class="unit">Mbit/s</div>
					</div>
				</div>
				<div class="testGroupColumn">
					<div class="testMeter">
						<div class="testName">Upload</div>
						<canvas id="ulMeter" class="meter"></canvas>
						<div id="ulText" class="meterText"></div>
						<div class="unit">Mbit/s</div>
					</div>
				</div>
			</div>
			<div class="testGroupRow">
				<div class="testGroupColumn">
					<div class="testChart">
						<canvas id="downloadUploadChart"></canvas>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
